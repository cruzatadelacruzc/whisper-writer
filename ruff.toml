# Lint for real errors only (pyflakes + basic pycodestyle); no style
# reformatting of the inherited WhisperWriter code.
#
# This selection is pinned deliberately, not left to ruff's built-in
# default: ruff 0.16's actual default rule set drifted well beyond
# E4/E7/E9/F (it also pulls in isort, flake8-executable, pylint, and
# other style/reformatting rules). Pin to errors + pyflakes only so
# `ruff check .` stays a correctness gate, not a reformatter.
target-version = "py310"
exclude = ["venv"]

[lint]
select = ["E4", "E7", "E9", "F"]
